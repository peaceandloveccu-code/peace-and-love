<style>
/* =========================================================
   DESIGN TOKENS — change colours, fonts and radii here
   ========================================================= */
:root{
  --navy:#0b1f4b; --navy-2:#12306f; --royal:#1f4fd8; --royal-d:#1a43b8;
  --gold:#d3191c; --gold-d:#a81317; --gold-l:#f6b9ba;
  --bg:#ffffff; --bg-alt:#f4f6fb; --surface:#ffffff; --text:#242832; --muted:#586073; --line:#e2e6ef;
  --heading:#0b1f4b; --link:#1a43b8; --focus:#1f4fd8; --ok:#0f7b4b; --err:#b3261e;
  --shadow:0 1px 2px rgba(11,31,75,.06),0 10px 28px -8px rgba(11,31,75,.14);
  --shadow-lg:0 2px 4px rgba(11,31,75,.06),0 24px 48px -12px rgba(11,31,75,.28);
  --r-card:20px; --r-ctl:12px; --r-pill:999px;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-head:"Fraunces",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1329; --bg-alt:#0d1a38; --surface:#111e40; --text:#e6eaf3; --muted:#a4afc6; --line:#22335e;
    --heading:#f1f4fb; --link:#8db0ff; --focus:#ffb3ac; --gold-d:#ff8a80; --err:#ff8a80; --ok:#5ed39a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -8px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1329; --bg-alt:#0d1a38; --surface:#111e40; --text:#e6eaf3; --muted:#a4afc6; --line:#22335e;
  --heading:#f1f4fb; --link:#8db0ff; --focus:#ffb3ac; --gold-d:#ff8a80; --err:#ff8a80; --ok:#5ed39a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -8px rgba(0,0,0,.55);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.0625rem/1.65 var(--font-body);overflow-x:hidden}
img,svg{max-width:100%}
a{color:var(--link);text-underline-offset:3px}
h1,h2,h3,h4{font-family:var(--font-head);color:var(--heading);line-height:1.15;letter-spacing:-.01em;font-weight:600;margin:0 0 .6em}
h1{font-size:clamp(2rem,4vw,3rem)}
h2{font-size:clamp(1.65rem,3vw,2.4rem)}
h3{font-family:var(--font-body);font-size:1.2rem;font-weight:700;letter-spacing:0;line-height:1.3}
p{margin:0 0 1em}
ul,ol{margin:0;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.hero :focus-visible,.foot :focus-visible,.util :focus-visible,.dark-panel :focus-visible{outline-color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:1rem;top:-4rem;background:var(--gold);color:var(--navy);padding:.7rem 1rem;border-radius:var(--r-ctl);font-weight:700;z-index:100;text-decoration:none}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + .5rem)}
.wrap{width:min(1180px,100% - 2rem);margin-inline:auto}
.section{padding:clamp(3rem,6vw,5.5rem) 0}
.section-alt{background:var(--bg-alt)}
.sec-head{max-width:40rem;margin-bottom:2.2rem}
.sec-head p{color:var(--muted);font-size:1.1rem}
.muted{color:var(--muted)}
.grid{display:grid;gap:1.4rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center}
.ic{flex:none;vertical-align:middle}

/* placeholders: everything that must be replaced is wrapped in <mark class="ph"> */
mark.ph{background:none;color:inherit;border-bottom:1.5px dotted var(--gold-d);padding:0 1px}
body.show-ph mark.ph{background:rgba(211,25,28,.28);outline:1px dashed var(--gold-d);border-bottom-color:transparent}
.tag{display:inline-flex;align-items:center;gap:.35rem;font-size:.8rem;font-weight:600;padding:.2rem .65rem;border-radius:var(--r-pill);background:rgba(242,182,50,.2);color:var(--heading);border:1px solid rgba(185,130,10,.45)}
.tag-cat{background:rgba(31,79,216,.1);border-color:transparent;color:var(--link)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font:700 1rem/1 var(--font-body);padding:.95rem 1.4rem;border-radius:var(--r-ctl);border:2px solid transparent;text-decoration:none;cursor:pointer;transition:background-color .2s,border-color .2s,color .2s,box-shadow .2s;min-height:48px}
.btn-primary{background:var(--royal);color:#fff}
.btn-primary:hover{background:var(--royal-d)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:#e23a3a}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.btn-ghost:hover{background:rgba(255,255,255,.12);border-color:#fff}
.btn-outline{background:transparent;color:var(--link);border-color:var(--line)}
.btn-outline:hover{border-color:var(--royal)}
.btn-sm{padding:.7rem 1rem;min-height:42px;font-size:.95rem}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.link-btn{background:none;border:0;padding:0;font:inherit;color:var(--link);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow)}
.pad{padding:1.6rem}
.icon-badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(31,79,216,.1);color:var(--royal)}
:root[data-theme="dark"] .icon-badge{color:#9db8ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .icon-badge{color:#9db8ff}}
.icon-gold{background:rgba(211,25,28,.14);color:var(--gold-d)}

/* utility bar + header */
.util{background:var(--navy);color:#c9d4ee;font-size:.88rem}
.util .wrap{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;flex-wrap:wrap}
.util a{color:#e6edff}
.util span{display:inline-flex;align-items:center;gap:.4rem;margin-right:1.2rem}
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(11,31,75,.06)}
.bar{display:flex;align-items:center;gap:1rem;min-height:72px}
.logo{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:var(--heading);margin-right:auto}
.logo-mark{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 1px rgba(11,26,82,.12);image-rendering:-webkit-optimize-contrast}
.logo b{font:600 1.15rem/1.1 var(--font-head);display:block}
.logo small{display:block;font-size:.72rem;color:var(--muted);font-weight:500}
.nav ul{list-style:none;display:flex;gap:.15rem}
.nav a{display:block;padding:.6rem .8rem;border-radius:10px;color:var(--text);font-weight:600;font-size:.96rem;text-decoration:none}
.nav a:hover{background:var(--bg-alt)}
.nav a[aria-current="page"]{color:var(--link);box-shadow:inset 0 -3px 0 var(--gold);border-radius:10px 10px 0 0}
.head-actions{display:flex;gap:.5rem;align-items:center}
.icon-btn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--heading);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--royal)}
.menu-btn{display:none}
@media (max-width:1100px){
  .menu-btn{display:grid}
  .head-actions .btn{display:none}
  .nav{position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow-lg);display:none;padding:.6rem 1rem 1rem}
  .nav[data-open="true"]{display:block}
  .nav ul{flex-direction:column;gap:0}
  .nav a{padding:.9rem .5rem;border-bottom:1px solid var(--line);border-radius:0}
  .nav a[aria-current="page"]{box-shadow:inset 4px 0 0 var(--gold);padding-left:1rem}
  .nav .btn{display:flex;margin-top:1rem}
}
@media (min-width:1101px){.nav .only-mobile{display:none}}
.util-right{display:flex;align-items:center;gap:1.4rem}
[tabindex="-1"]:focus:not(:focus-visible),h1[tabindex="-1"]:focus{outline:none}
.admin-site .crumbs{display:none}
.admin-site .site-head .tag{white-space:nowrap}
@media (max-width:640px){.admin-site .logo small,.admin-site .site-head .tag{display:none}.admin-site .logo b{font-size:1rem}}
@media (max-width:420px){.admin-site .logo span{display:none}}
.util .util-links{margin:0}
@media (max-width:760px){.util .util-links{display:none}.util span:nth-child(n+2){display:none}.util .wrap{align-items:center}}

/* hero */
.hero{background:linear-gradient(135deg,var(--navy) 0%,#0f2a63 60%,#143a8a 100%);color:#fff;position:relative;overflow:hidden}
.hero-in{display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:center;padding:clamp(2.5rem,6vw,4.75rem) 0 clamp(6.5rem,10vw,8.5rem)}
.hero h1{color:#fff;font-size:clamp(2.4rem,5.4vw,4.2rem);line-height:1.04;margin:0 0 1.2rem;font-weight:600}
.hero .lead{color:#d0daf2;font-size:1.2rem;max-width:34rem;margin-bottom:1.8rem}
.hero-points{list-style:none;display:flex;flex-wrap:wrap;gap:.5rem 1.4rem;margin-top:1.8rem;color:#d0daf2;font-size:.98rem}
.hero-points li{display:flex;gap:.45rem;align-items:center}
.hero-points .ic{color:var(--gold)}
.hero-art{position:relative;border-radius:28px;overflow:hidden;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.18)}
.hero-art svg,.hero-art img{display:block;width:100%;height:auto}
.hero-art .cap{position:absolute;left:12px;bottom:12px;background:rgba(11,31,75,.82);color:#fff;font-size:.76rem;padding:.3rem .7rem;border-radius:var(--r-pill)}
.weave{position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(90deg,var(--gold) 0 28px,#0b1f4b 28px 36px,var(--royal) 36px 64px,#0b1f4b 64px 72px,var(--gold-l) 72px 80px,#0b1f4b 80px 88px)}
.weave-thin{height:8px;border-radius:8px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero-copy>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hero-copy>:nth-child(2){animation-delay:.08s}.hero-copy>:nth-child(3){animation-delay:.16s}.hero-copy>:nth-child(4){animation-delay:.24s}
.hero-art{animation:rise .9s .2s cubic-bezier(.2,.7,.2,1) both}
@media (max-width:900px){.hero-in{grid-template-columns:1fr}}

/* quick cards */
.quick{margin-top:-4.6rem;position:relative;z-index:2}
.qcard{display:flex;flex-direction:column;gap:.7rem;padding:1.5rem;text-decoration:none;color:var(--text);height:100%;transition:border-color .2s,box-shadow .2s}
.qcard:hover{border-color:var(--gold);box-shadow:var(--shadow-lg)}
.qcard h3{margin:0;color:var(--heading)}
.qcard p{margin:0;color:var(--muted);font-size:.98rem}

/* page head + breadcrumbs */
.page-head{background:var(--bg-alt);border-bottom:1px solid var(--line);padding:1.6rem 0 2.4rem}
.crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:.4rem;font-size:.9rem;color:var(--muted);margin-bottom:1.2rem}
.crumbs li+li::before{content:"/";margin-right:.4rem;color:var(--line)}
.page-head p.lead{max-width:44rem;color:var(--muted);font-size:1.15rem;margin:0}
.page-head h1{margin-bottom:.4em}

/* benefit / value lists */
.benefit{display:flex;gap:1rem;align-items:flex-start}
.benefit h3{margin:0 0 .15rem;font-size:1.05rem}
.benefit p{margin:0;color:var(--muted);font-size:.96rem}
.split{display:grid;grid-template-columns:.8fr 1.2fr;gap:3rem;align-items:start}
.benefits-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6rem 1.8rem}
.benefits-grid .benefit:last-child{grid-column:1/-1}

/* product cards */
.pcard{display:flex;flex-direction:column;height:100%;overflow:hidden}
.pcard-top{padding:1.6rem 1.6rem 1rem;display:flex;gap:1rem;align-items:flex-start}
.pcard-top h3{margin:0 0 .2rem;font-size:1.3rem}
.pcard-top p{margin:0;color:var(--muted);font-size:.98rem}
.spec{margin:0;padding:0 1.6rem;flex:1}
.spec div{display:grid;grid-template-columns:9.5rem 1fr;gap:.8rem;padding:.7rem 0;border-top:1px solid var(--line);font-size:.96rem}
.spec dt{color:var(--muted);font-weight:600}
.spec dd{margin:0}
.spec ul{padding-left:1.1rem}
.pcard-foot{padding:1.2rem 1.6rem 1.6rem;display:flex;gap:.6rem;flex-wrap:wrap}
@media (max-width:520px){.spec div{grid-template-columns:1fr;gap:.1rem}}

/* article / news cards */
.art{position:relative;aspect-ratio:16/9;display:grid;place-items:center;color:#fff;overflow:hidden}
.art .ic{width:64px;height:64px;position:relative;z-index:1;stroke-width:1.4}
.art::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.1);right:-50px;top:-70px}
.art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,var(--gold) 0 20px,transparent 20px 28px)}
.acard{display:flex;flex-direction:column;overflow:hidden;height:100%}
.acard-body{padding:1.3rem 1.5rem 1.6rem;display:flex;flex-direction:column;gap:.6rem;flex:1}
.acard-body h3{margin:0}
.acard-body p{margin:0;color:var(--muted);font-size:.97rem}
.acard-meta{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;font-size:.85rem;color:var(--muted)}
.acard-body .btn{align-self:flex-start;margin-top:auto}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.6rem}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:.5rem 1rem;border-radius:var(--r-pill);font:600 .92rem var(--font-body);cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--royal);border-color:var(--royal)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--royal);border-color:var(--royal)}}

/* testimonials */
.quote{padding:1.6rem;display:flex;flex-direction:column;gap:1rem;height:100%}
.quote blockquote{margin:0;font:500 1.12rem/1.55 var(--font-head)}
.quote figcaption{margin-top:auto;font-size:.94rem;display:flex;flex-direction:column;gap:.3rem}
.quote .avatar{width:56px;height:56px}
.who{display:flex;gap:.8rem;align-items:center}
.avatar{border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.avatar-photo{object-fit:cover;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--line)}

/* dark panel + CTA */
.dark-panel{background:linear-gradient(135deg,var(--navy),#12306f);color:#fff;border-radius:28px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.dark-panel h2,.dark-panel h3{color:#fff}
.cta{padding:clamp(2.2rem,5vw,4rem) clamp(1.4rem,5vw,4rem) calc(clamp(2.2rem,5vw,4rem) + 10px);text-align:left}
.cta p{color:#d0daf2;max-width:38rem;font-size:1.15rem}
.cta .weave{border-radius:0 0 28px 28px;height:10px}

/* calculator */
.calc{display:grid;grid-template-columns:1.1fr .9fr;overflow:hidden}
.calc-form{padding:1.8rem}
.calc-out{background:linear-gradient(160deg,var(--navy),#12306f);color:#fff;padding:1.8rem;display:flex;flex-direction:column;justify-content:center;gap:1.2rem}
.calc-out .big{font:600 clamp(2rem,4vw,2.8rem)/1.1 var(--font-head);color:var(--gold)}
.calc-out dt{font-size:.9rem;color:#c5d0ea}
.calc-out dd{margin:0 0 .8rem;font-size:1.3rem;font-weight:700}
.calc-out .empty{color:#c5d0ea;margin:0}
.calc-note{grid-column:1/-1;margin:0;padding:.9rem 1.8rem;font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);background:var(--bg-alt)}
@media (max-width:860px){.calc{grid-template-columns:1fr}}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.1rem 1.2rem}
.field{display:flex;flex-direction:column;gap:.35rem}
.field.span{grid-column:1/-1}
label,.lbl{font-weight:600;font-size:.96rem;color:var(--heading)}
.req{color:var(--err)}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1.5px solid #9aa4b8;border-radius:var(--r-ctl);padding:.8rem .9rem;min-height:48px;width:100%}
textarea{min-height:120px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--royal)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(31,79,216,.35);outline-offset:0;border-color:var(--royal)}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--err)}
input:disabled{background:var(--bg-alt);cursor:not-allowed}
.help{margin:0;font-size:.86rem;color:var(--muted)}
.err{margin:0;font-size:.88rem;color:var(--err);font-weight:600}
.check{display:flex;gap:.7rem;align-items:flex-start;font-weight:400;font-size:.96rem;color:var(--text)}
.check input{width:22px;height:22px;min-height:0;margin-top:2px;accent-color:var(--royal);flex:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.form-summary{border:1.5px solid var(--err);border-radius:var(--r-ctl);padding:.9rem 1rem;margin-bottom:1.2rem;color:var(--err);font-weight:600}
.form-note{font-size:.86rem;color:var(--muted);margin:1rem 0 0}
.success{border:1.5px solid var(--ok);background:rgba(15,123,75,.08);border-radius:var(--r-card);padding:1.8rem}
.success h3{color:var(--ok);display:flex;gap:.5rem;align-items:center}
.notice{display:flex;gap:.8rem;border-radius:var(--r-ctl);padding:1rem 1.1rem;background:rgba(242,182,50,.16);border:1px solid rgba(185,130,10,.4);font-size:.95rem}
.notice .ic{color:var(--gold-d);margin-top:2px}
details.priv{border:1px solid var(--line);border-radius:var(--r-ctl);padding:.8rem 1rem;background:var(--bg-alt);font-size:.94rem}
details.priv summary{cursor:pointer;font-weight:700;color:var(--heading)}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}

/* accordion */
.acc{display:grid;gap:.8rem;max-width:52rem}
.acc-item{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.acc-q{width:100%;display:flex;justify-content:space-between;gap:1rem;align-items:center;text-align:left;background:none;border:0;padding:1.1rem 1.3rem;font:700 1.05rem/1.4 var(--font-body);color:var(--heading);cursor:pointer;min-height:56px}
.acc-q .ic{transition:transform .25s;color:var(--royal)}
.acc-q[aria-expanded="true"] .ic{transform:rotate(180deg)}
.acc-a{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .28s ease,visibility 0s .28s}
.acc-a.open{grid-template-rows:1fr;visibility:visible;transition-delay:0s}
.acc-a>div{overflow:hidden}
.acc-a p{padding:0 1.3rem 1.2rem;margin:0;color:var(--muted)}

/* misc content blocks */
.timeline{list-style:none;border-left:3px solid var(--gold);margin-left:.5rem;display:grid;gap:1.4rem;padding-left:1.6rem}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:calc(-1.6rem - 9px);top:.4rem;width:15px;height:15px;border-radius:50%;background:var(--navy);border:3px solid var(--gold)}
.timeline b{display:block}
.steps{list-style:none;counter-reset:s;display:grid;gap:1.2rem}
.steps li{counter-increment:s;display:flex;gap:1rem;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:800;display:grid;place-items:center}
.steps h3{margin:0 0 .2rem;font-size:1.05rem}
.steps p{margin:0;color:var(--muted)}
.ticks{list-style:none;display:grid;gap:.6rem}
.ticks li{display:flex;gap:.6rem;align-items:flex-start}
.ticks .ic{color:var(--ok);margin-top:3px}
.person{padding:1.4rem;text-align:left}
.person .avatar{width:64px;height:64px;font-size:1.3rem;margin-bottom:.9rem}

/* leadership & team */
.team-cat{margin-bottom:3rem}
.team-cat:last-child{margin-bottom:1.6rem}
.team-cat-h{font-size:1.3rem;margin-bottom:.3rem}
.team-cat-desc{max-width:42rem;margin-bottom:1.6rem}
.team-card{padding:1.8rem 1.4rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.3rem;transition:transform .22s,box-shadow .22s,border-color .22s}
.team-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--royal)}
.team-photo{margin-bottom:.5rem}
.team-card .avatar{width:96px;height:96px;font-size:1.9rem}
.team-name{margin:0;font-size:1.05rem}
.team-title{margin:0;color:var(--link);font-weight:600;font-size:.9rem}
.team-bio{margin:.3rem 0 0;color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.team-card .btn{margin-top:.8rem}
.profile-top{display:flex;gap:1.2rem;align-items:center;margin-bottom:.2rem}
.profile-top .avatar{flex:none}
.profile-avatar{width:120px;height:120px;font-size:2.4rem}
.profile-title{margin:0 0 .4rem;font-weight:700;color:var(--heading)}
.team-photo-edit{display:flex;flex-direction:column;align-items:center;gap:.6rem;flex:none}
.team-photo-edit .avatar{width:72px;height:72px;font-size:1.4rem}
.team-admin-card{margin-bottom:1.2rem}
.flyer{margin:0;overflow:hidden;padding:0;max-width:440px;justify-self:center}
.flyer img{display:block;width:100%;height:auto}
a[href^="tel:"]{white-space:nowrap}
.mapbox{border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line);background:var(--bg-alt);min-height:260px;display:grid;place-items:center;text-align:center;padding:1.5rem;position:relative}
.mapbox svg.bg{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.mapbox>div{position:relative}
.hours{width:100%;border-collapse:collapse;font-size:.96rem}
.hours th,.hours td{text-align:left;padding:.5rem 0;border-top:1px solid var(--line);font-weight:400}
.hours th{color:var(--muted)}
.info-list{list-style:none;display:grid;gap:1.1rem}
.info-list li{display:flex;gap:.9rem;align-items:flex-start}
.info-list b{display:block;font-size:.9rem;color:var(--muted);font-weight:600}
.prose{max-width:44rem}
.prose h2{font-size:1.5rem;margin-top:2rem}
.prose p,.prose li{color:var(--text)}
.prose ul{padding-left:1.2rem;margin-bottom:1em}
.article-hero{border-radius:var(--r-card);overflow:hidden;margin-bottom:2rem}
.article-hero .art{aspect-ratio:21/8}

/* footer */
.foot{background:var(--navy);color:#c5d0ea;position:relative;margin-top:0}
.foot .weave{position:static;height:10px}
.foot-in{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:2.4rem;padding:3.5rem 0 2.5rem}
.foot h2{font:700 1rem var(--font-body);color:#fff;margin-bottom:1rem;letter-spacing:0}
.foot ul{list-style:none;display:grid;gap:.55rem}
.foot a,.foot .link-btn{color:#c5d0ea;text-decoration:none;font-size:.96rem}
.foot a:hover,.foot .link-btn:hover{color:#fff;text-decoration:underline}
.foot .logo{color:#fff;margin-bottom:1rem}
.foot .logo-mark{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.foot .logo small{color:#aab7d6}
.social{display:flex;gap:.6rem;margin-top:1.2rem}
.social a{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;color:#fff}
.social a:hover{background:rgba(255,255,255,.12)}
.foot-base{border-top:1px solid rgba(255,255,255,.14);padding:1.4rem 0 calc(1.8rem + 64px);font-size:.86rem;display:flex;flex-wrap:wrap;gap:.8rem 2rem;justify-content:space-between;align-items:center}
@media (max-width:960px){.foot-in{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.foot-in{grid-template-columns:1fr}}

/* floating contact button + toast + dialogs */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:.5rem;background:#1a9b57;color:#fff;font-weight:700;padding:.85rem 1.1rem;border-radius:var(--r-pill);text-decoration:none;box-shadow:var(--shadow-lg);min-height:52px}
.fab:hover{background:#158a4c}
.fab.plain{background:var(--royal)}
#live{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:.5rem;width:min(92vw,440px);pointer-events:none}
.toast{pointer-events:auto;background:var(--navy);color:#fff;padding:.9rem 1.1rem;border-radius:14px;box-shadow:var(--shadow-lg);border-left:5px solid var(--gold);animation:rise .3s both;font-weight:600;font-size:.96rem}
.toast.bad{border-left-color:#ff6b5e}
dialog{border:0;padding:0;border-radius:24px;width:min(640px,calc(100% - 1.5rem));max-height:calc(100dvh - 2rem);background:var(--surface);color:var(--text);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(6,14,36,.62)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.2rem 1.5rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-head h2{margin:0;font-size:1.35rem}
.dlg-body{padding:1.5rem}
.results{list-style:none;display:grid;gap:.4rem;margin-top:1rem}
.results a{display:block;padding:.8rem .9rem;border-radius:12px;text-decoration:none;color:var(--text);border:1px solid transparent}
.results a:hover,.results a:focus-visible{background:var(--bg-alt);border-color:var(--line)}
.results small{color:var(--muted);display:block}

@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr;gap:1.6rem}}
@media (max-width:640px){.g2,.g3,.g4,.benefits-grid{grid-template-columns:1fr}.quick{margin-top:-3.6rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{.util,.site-head,.fab,.foot .social{display:none}}
</style>

function person(x, y, s, skin, cloth, o = {}) {

  return `<g>
  <rect x="${x - bw}" y="${y - bh}" width="${bw * 2}" height="${bh}" rx="${bw * .9}" fill="${cloth}"/>
  ${o.stripe ? `<rect x="${x - 4 * s}" y="${y - bh + 6 * s}" width="${8 * s}" height="${bh * .55}" rx="${3 * s}" fill="${o.stripe}"/>` : ""}
  <rect x="${x - 6 * s}" y="${y - bh - 8 * s}" width="${12 * s}" height="${14 * s}" rx="${4 * s}" fill="${skin}"/>
  <circle cx="${x}" cy="${cy}" r="${hr}" fill="${skin}"/>
  ${o.hair ? `<path d="M${x - hr} ${cy} a${hr} ${hr} 0 0 1 ${hr * 2} 0 q${-hr} ${-6 * s} ${-hr * 2} 0z" fill="${o.hair}"/>` : ""}
  ${o.wrap ? `<ellipse cx="${x}" cy="${cy - hr * .62}" rx="${hr * 1.18}" ry="${hr * .72}" fill="${o.wrap}"/><ellipse cx="${x + hr * .3}" cy="${cy - hr * .95}" rx="${hr * .55}" ry="${hr * .3}" fill="#fff" opacity=".35"/>` : ""}
  </g>`;
}

  <div class="form-grid">
   <div class="field"><label for="${id}-a">Loan amount (GH₵)<span class="req" aria-hidden="true"> *</span></label><input id="${id}-a" name="amount" inputmode="decimal" autocomplete="off" placeholder="e.g. 5000" aria-required="true"></div>

   <div class="field span"><label for="${id}-m">How interest is charged</label><select id="${id}-m" name="method"><option value="reducing">Reducing balance (interest on what you still owe)</option><option value="flat">Flat rate (interest on the original amount)</option></select>

 <p class="calc-note">Estimates only. Actual repayments depend on the loan product, fees and how interest is calculated. Final terms are subject to credit-union approval.</p></div>`; };

function Field(fid, f) {
  const id = `${fid}-${f.name}`, d = [f.help ? id + "-h" : "", id + "-e"].filter(Boolean).join(" ");
  const common = `id="${id}" name="${f.name}" ${f.ac ? `autocomplete="${f.ac}"` : 'autocomplete="off"'} aria-describedby="${d}" ${f.req ? 'aria-required="true"' : ""} maxlength="${f.type === "date" ? 10 : f.max}"`;
  let ctl;
  if (f.type === "select") ctl = `<select id="${id}" name="${f.name}" aria-describedby="${d}" ${f.req ? 'aria-required="true"' : ""}><option value="">Select…</option>${f.options.map(o => `<option>${esc(o)}</option>`).join("")}</select>`;
  else if (f.type === "textarea") ctl = `<textarea ${common}></textarea>`;
  else ctl = `<input type="${f.type}" ${common} ${f.type === "date" ? `max="${new Date().toISOString().slice(0, 10)}"` : ""} ${f.type === "tel" ? 'inputmode="tel"' : ""}>`;
  return `<div class="field ${f.span ? "span" : ""}"><label for="${id}">${esc(f.label)}${f.req ? '<span class="req" aria-hidden="true"> *</span>' : ""}</label>${ctl}${f.help ? `<p class="help" id="${id}-h">${esc(f.help)}</p>` : ""}<p class="err" id="${id}-e" hidden></p></div>`;
}
const Form = (key, extra = {}) => {
  const def = FORMS[key], fid = uid(key);
  return `<form class="form" data-form="${key}" data-fid="${fid}" data-t="${Date.now()}" novalidate>
   <div class="form-summary" role="alert" tabindex="-1" hidden></div>
   <div class="form-grid">${def.fields.map(f => Field(fid, { ...f, ...(extra[f.name] || {}) })).join("")}</div>
   <div class="hp" aria-hidden="true"><label>Leave this field empty<input tabindex="-1" autocomplete="off" name="website" type="text"></label></div>
   <div class="field" style="margin-top:1.2rem;gap:.8rem">${def.consents.map((c, i) => `<div><label class="check" for="${fid}-c${i}"><input type="checkbox" id="${fid}-c${i}" name="consent${i}" aria-required="true" aria-describedby="${fid}-c${i}-e"><span>${esc(c)} <a href="#/legal/${i === 1 ? "terms" : "privacy"}" target="_blank" rel="noopener">${i === 1 ? "Terms" : "Privacy notice"}</a></span></label><p class="err" id="${fid}-c${i}-e" hidden></p></div>`).join("")}</div>
   <div style="margin-top:1.4rem"><button class="btn btn-primary" type="submit">${def.submit}</button></div>
   <p class="form-note">This is an information / enquiry form, not a financial transaction. We will never ask for your PIN, password or OTP.</p></form>`;
};

const PrivacyNotice = () => `<details class="priv"><summary>Privacy notice and how we handle your information</summary>

async function sbFetch(path, { method = "GET", body, headers = {}, timeout = 10000 } = {}) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), timeout);
  const hdr = { apikey: SUPABASE.key, "Content-Type": "application/json", ...headers };
  if (SB_SESSION && !path.startsWith("/auth/v1/token")) hdr.Authorization = "Bearer " + SB_SESSION.access_token;
  try {
    const res = await fetch(SUPABASE.url + path, { method, headers: hdr, body: body === undefined ? undefined : JSON.stringify(body), signal: ctl.signal });
    const text = await res.text(); let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) {}
    if (!res.ok) { const err = new Error((data && (data.message || data.msg || data.error_description || data.error)) || "HTTP " + res.status); err.status = res.status; err.code = data && (data.code || data.error_code); throw err; }
    return data;
  } finally { clearTimeout(timer); }
}
function sbKeep(s) {
  SB_SESSION = s ? { access_token: s.access_token, refresh_token: s.refresh_token, expires_at: s.expires_at || Math.floor(Date.now() / 1000) + (s.expires_in || 3600), user: s.user ? { id: s.user.id, email: s.user.email } : null } : null;
  lsSet(SB_STORE, SB_SESSION ? JSON.stringify(SB_SESSION) : null);
}
async function sbFresh() {
  if (!SB_SESSION) return;

  try { sbKeep(await sbFetch("/auth/v1/token?grant_type=refresh_token", { method: "POST", body: { refresh_token: SB_SESSION.refresh_token } })); }
  catch (e) { sbKeep(null); }
}

async function initPlatform() {
  // 1) Supabase
  try {
    const saved = lsGet(SB_STORE); if (saved) { try { SB_SESSION = JSON.parse(saved); } catch (e) { SB_SESSION = null; } }
    await sbFresh();
    const [site, team] = await Promise.all([
      sbFetch("/rest/v1/site_content?id=eq.site&select=data"),
      sbFetch("/rest/v1/team_members?select=id,name,title,category,bio,photo,sort_order,deleted")
    ]);
    BACKEND = "supabase";
    if (Array.isArray(site) && site[0] && site[0].data) applyContent(site[0].data);
    if (Array.isArray(team)) applyTeamRows(team.map(r => ({ ...r, order: r.sort_order })));
    try { await adminAccessFromSession(); } catch (e) { ACCESS = "login"; }
    renderChrome(); route(true); return;
  } catch (e) { BACKEND = null; }
  // 2) Claude artifact storage
  if (typeof claude !== "undefined") {
    try {
      const user = await claude.use("user");
      DB = await claude.use("db");
      if (user) { const can = await user.can("data.write"); ACCESS = can === false ? "denied" : "granted"; } // null = platform said nothing: stay optimistic, let a refused write decide
      else ACCESS = "denied";
      if (DB) {
        BACKEND = "claude";
        const snap = await DB.doc("content/site").get(); if (snap.exists) { const data = snap.data(); if (data) applyContent(data); }
        try { // team members: one document each in the top-level "team" collection
          const q = await DB.collection("team").get();
          applyTeamRows(q.docs.map(d => ({ ...(d.data() || {}), id: d.id })).filter(r => r.category || r.deleted));
        } catch (e) { /* keep the built-in team list */ }
      }
    } catch (e) { ACCESS = "denied"; }
    renderChrome(); route(true); return;
  }
  ACCESS = "unavailable"; route(true);
}

function saveFailed(e) {
  if (e && (e.status === 401 || e.status === 403 || e.code === "42501" || e.code === "invalid_argument")) {
    if (BACKEND === "supabase") { toast("Your sign-in has expired or this account can't make changes. Please sign in again.", true); sbKeep(null); ACCESS = "login"; }
    else { ACCESS = "denied"; toast("You don't have permission to save changes here.", true); }
    if (location.hash.replace(/^#\/?/, "").split("/")[0] === "admin") route(true);
    return true;
  }

  toast("Couldn't save. Please check your connection and try again.", true); return true;
}

function squarePhoto(file, size) {
  size = size || 300;
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), sx = (img.width - s) / 2, sy = (img.height - s) / 2;
      const c = document.createElement("canvas"); c.width = size; c.height = size;
      c.getContext("2d").drawImage(img, sx, sy, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image load failed")); };
    img.src = url;
  });
}

  if (d.articles) d.articles.forEach((a, i) => ARTICLES[i] && Object.assign(ARTICLES[i], a));

let first = true;
function route(soft) {
  const raw = location.hash.replace(/^#\/?/, "").split("?")[0];
  let [name, arg] = raw.split("/");
  if (IS_ADMIN_SITE) name = "admin";
  let page = null;
  if (name === "admin" && !ADMIN_ROUTE_OK) page = NOTFOUND();
  else if (name === "article" || (name === "education" && arg)) page = PAGES.article(arg);
  else if (name === "legal") page = PAGES.legal(arg);
  else if (PAGES[name] && name !== "article" && name !== "legal") page = PAGES[name]();
  if (!page) page = NOTFOUND();
  const main = $("#main");
  main.innerHTML = page.html;
  document.title = (page.title === "Home" ? "" : page.title + " | ") + CONFIG.name;
  const md = $('meta[name="description"]'); if (md && page.desc) md.setAttribute("content", page.desc);
  const active = page.nav !== undefined ? page.nav : name;
  $$("[data-nav]").forEach(a => a.dataset.nav === active ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  if (soft !== true) closeMenu();

}

/* calculator */
function calc(form) {
  const v = n => form.elements[n].value.replace(/,/g, "").trim(), out = $("[data-calc-out]", form.closest(".calc")), err = $("[data-calc-err]", form);
  const P = parseFloat(v("amount")), r = parseFloat(v("rate")), t = parseFloat(v("term")), n = Math.round(form.elements.unit.value === "y" ? t * 12 : t);
  let m = "";
  if (!(P > 0) || !isFinite(P)) m = "Enter a loan amount greater than zero."; else if (P > 1e9) m = "Enter a smaller loan amount.";
  else if (!isFinite(r) || r < 0 || r > 100) m = "Enter an annual interest rate between 0 and 100.";
  else if (!(n >= 1) || n > 600) m = "Enter a repayment period of at least 1 month (up to 50 years).";
  if (m) { err.textContent = m; err.hidden = false; return false; }
  err.hidden = true;
  let pmt, total;
  if (form.elements.method.value === "flat") { total = P + P * (r / 100) * (n / 12); pmt = total / n; }
  else { const i = r / 1200; pmt = i === 0 ? P / n : P * i * Math.pow(1 + i, n) / (Math.pow(1 + i, n) - 1); total = pmt * n; }
  out.innerHTML = `<div><p class="empty" style="margin:0">Estimated monthly repayment</p><p class="big" style="margin:.2rem 0 0">${money(pmt)}</p></div>
   <dl style="margin:0"><dt>Total interest</dt><dd>${money(total - P)}</dd><dt>Total repayment</dt><dd>${money(total)}</dd></dl>
   <p class="empty" style="font-size:.85rem">Based on ${money(P)} over ${n} month${n === 1 ? "" : "s"} at ${r}% a year (${form.elements.method.value === "flat" ? "flat rate" : "reducing balance"}). Estimate only; final terms are subject to credit-union approval.</p>`;
  return true;
}

/* forms: validation, sanitising, spam protection */
const clean = (s, max, multi) => s.replace(multi ? /[\u0000-\u0009\u000B-\u001F\u007F]/g : /[\u0000-\u001F\u007F]/g, " ").replace(/[<>]/g, "").replace(/[ \t]{2,}/g, " ").trim().slice(0, max);
function check(f, val) {
  if (!val) return f.req ? (f.type === "select" ? "Select " + f.label.toLowerCase() + "." : f.err || "Fill in this field.") : "";
  if (f.type === "email" && !/^[^\s@]{1,64}@[^\s@]+\.[^\s@]{2,}$/.test(val)) return f.bad || "Enter a valid email address.";
  if (f.type === "tel" && (!/^\+?[0-9\s()-]{9,18}$/.test(val) || val.replace(/\D/g, "").length < 9)) return f.bad;
  if (f.type === "date") { const d = new Date(val); if (isNaN(d) || d > new Date() || d.getFullYear() < 1900) return f.bad; }
  if (f.kind === "name" && !/^[\p{L}\p{M}'’ .-]{2,80}$/u.test(val)) return "Use letters, spaces, hyphens and apostrophes only.";
  if (f.kind === "id" && !/^[A-Za-z0-9\-\/ ]{5,24}$/.test(val)) return f.bad;
  return "";
}
const lastSent = {};
async function send(key, data) {
  if (!CONFIG.formEndpoint) { await new Promise(r => setTimeout(r, 500)); return { demo: true }; }
  const res = await fetch(CONFIG.formEndpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ form: key, ...data }) });
  if (!res.ok) throw new Error("Request failed"); return {};
}
async function submitForm(form) {

  if (form.elements.website.value) return finish(form, def, true);                         // honeypot: bots see a success and nothing is sent
  if (Date.now() - Number(form.dataset.t) < 2500) { toast("Please take a moment to check your details, then submit again.", true); return; }
  if (lastSent[key] && Date.now() - lastSent[key] < 15000) { toast("Please wait a few seconds before sending another message.", true); return; }
  const data = {};
  def.fields.forEach(f => {
    const el = form.elements[f.name], val = clean(el.value || "", f.type === "date" ? 10 : f.max, f.type === "textarea"), msg = check(f, val), e = $("#" + el.id + "-e");
    data[f.name] = val; el.setAttribute("aria-invalid", msg ? "true" : "false"); e.textContent = msg; e.hidden = !msg;
    if (msg) errors.push([el, msg]);

  if (errors.length) {

    toast("Some details need fixing. Check the highlighted fields.", true); errors[0][0].scrollIntoView({ block: "center", behavior: "smooth" }); return;
  }
  summary.hidden = true;
  const btn = $('button[type="submit"]', form), label = btn.textContent; btn.disabled = true; btn.textContent = "Sending…";
  try { const r = await send(key, data); lastSent[key] = Date.now(); finish(form, def, false, r.demo); }
  catch (e) { btn.disabled = false; btn.textContent = label; toast("We couldn't send that. Please try again, or contact us directly.", true); }
}
function finish(form, def, silent, demo) {

   ${demo && !silent ? `<p class="help" style="margin-top:1rem"><mark class="ph">Demo mode:</mark> no form endpoint is configured, so nothing was sent or stored. Set <code>CONFIG.formEndpoint</code> to your secure server before going live.</p>` : ""}</div>`;
